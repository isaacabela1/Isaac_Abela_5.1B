<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    
    <form 
    action="mailto:hello@website.com"
    method="post"
    enctype="text/plain">
    <fieldset>
        <legend>Personal Details</legend>
        <div id="divFirstName">
            <label for="">First Name:</label>
            <input type="text" id="firstname" name="name" placeholder="Joseph" required>
        </div>
        
        <div id="divLastName">
            <label for="">Last Name:</label>
            <input type="text" id="lastname" name="surname" placeholder="Digby" required>
        </div>
        
        
        <div id="divAge">
            <p>
                Age Group:
            </p>
            <input type="radio" id="age1" name="age" value="1">
            <label for="age1">15-18</label>
            
            <br>
            
            <input type="radio" id="age2" name="age" value="2">
            <label for="age2">19-25</label>
            
            <br>
            
            <input type="radio" id="age3" name="age" value="3">
            <label for="age3">26-35</label>
            
            <br>
            
            <input type="radio" id="age4" name="age" value="4">
            <label for="age4">36+</label>
        </div>
    </fieldset>
    
    <fieldset>
        <legend>Contact Information</legend>
        <div>
            <label for="">Email Address</label>
            <input type="text" id="email" name="email" placeholder="joeydigby@power.com" required>
        </div>
        <label for="">Phone Number</label>
        <input type="text" id="phone" name="phoneNumber" placeholder="42098778" required pattern="[0-9]{4} [0-9]{4}">
        <div>
            
            <div>
                <input type="checkbox" id="offers" name="offers">
                <label for="offers">Contact me about new offers</label>
            </div>
            
        </fieldset>

        <fieldset>
            <legend>Message Details</legend>
            <div>
                <label for="department">Department:</label>
                <select name="" id="department">
                    <option value="" disabled selected>Please select a department</option>
                    <option value="1">Customer Support</option>
                    <option value="2">Technical Support</option>
                </select>
            </div>

            <div>
                <label for="">Message:</label>
                <textarea name="fullMessage" id="message" 
                placeholder="I have a problem with my account..." cols="30" rows="10"></textarea>
            </div>
        </fieldset>
        
        <div id="divButtons">
            <button type="submit">Send</button>
            <button type="reset">Cancel</button>
        </div>
    </form>
</body>
</html>
